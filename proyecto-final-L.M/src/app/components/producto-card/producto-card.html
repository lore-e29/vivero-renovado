<div class="card ">
    <hr>
    <div class="d-flex justify-content-center  ">
        <img [ src ]="producto.imagen"
         [ alt ]="producto.nombre"
         class="card-img-top" >

    </div>
    <div>
        <h5 class="card-body text-center">{{ producto.nombre }}
        <p >${{ producto.precio }}</p> </h5>
        <p>{{ producto.pago}}</p>
        <button class="btn btn-success" (click)="onAgregar()">Comprar</button>

    </div>
</div>
